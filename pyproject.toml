[project]
name = "aps"
dynamic = [
    "version",
]
description = ""
authors = [
    {name = "Oddvar Lia", email = "olia@equinor.com"},
    {name = "Sindre Nistad", email = "snis@equinor.com"},
    {name = "Sebastian Vittersø", email = "svit@equinor.com"},
]
requires-python = '>=3.11,<4.0'
dependencies = [
    'matplotlib (>=3.6.0,<4.0.0)',
    'numpy (>=1.19.5,<2.0.0)',
    'Pillow (>=10.3.0,<11.0.0)',
    'scipy (>=1.10.0,<2.0.0)',
    'xtgeo (>=4.3.3,<5.0.0)',
    'PyYAML (>=6.0,<7.0)',
    'gaussianfft (>=1.1.2,<2.0.0)',
    'fmu-tools (>=1.21.0,<2.0.0)',
]

[project.scripts]
generate-workflow-blocks = "aps.toolbox.generate_workflow_blocks.__main__:run"
parse-truncation-rule-templates = "aps.toolbox.parse_truncation_rule_templates.__main__:main"

[dependency-groups]
dev = [
    'pytest (>=6.2.5,<7.0.0)',
    'graphviz (>=0.19.1,<1.0.0)',
    'mypy (>=0.931,<1.0.0)',
    'Flask (>=3.0.0,<4.0.0)',
    'python-dotenv (>=0.19.2,<1.0.0)',
    'typing-extensions (>=4.12.2,<5.0.0)',
]
docs = [
    "mkdocs-material (>=9.6.20,<10.0.0)",
    "mkdocs-git-revision-date-localized-plugin (>=1.4.7,<2.0.0)"
]

[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-build-scripts"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = [
    "src/aps",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"
local_scheme = "node-and-timestamp"

[tool.hatch.build.hooks.vcs]
version-file = "src/aps/_version/__init__.py"
template = """
# file generated by setuptools-scm
# don't change, don't track in version control
from datetime import datetime
from .constants import (
    BUILD_TIMESTAMP as build_timestamp,
    COMMIT as commit,
)

__version__: str
__version_tuple__: tuple[int, int, int] | tuple[int, int, int, str, str, str]

version = __version__ = {version!r}
version_tuple = __version_tuple__ = {version_tuple!r}


def build_number() -> str:
    day_of_year = build_timestamp.timetuple().tm_yday
    return f'{{build_timestamp.year % 100}}{{day_of_year}}{{build_timestamp.hour:02d}}{{build_timestamp.minute:02d}}'


__all__ = [
    '__version__',
    '__version_tuple__',
    'version',
    'version_tuple',
    'build_timestamp',
    'build_number',
    'commit',
]

"""

[[tool.hatch.build.hooks.build-scripts.scripts]]
out_dir = "src/aps/_version"
commands = [
    """
    cat <<EOF > constants.py
from datetime import datetime

BUILD_TIMESTAMP = datetime.fromisoformat('$(date -Iseconds)')
COMMIT = '$(git rev-parse HEAD)'
EOF
""",
]
artifacts = [
    "/constants.py",
]

[tool.ruff]
[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["I"]
ignore = [
    "F403",
    "F821",
    "E731",
    "E722",
    "E721",
    "F841",
]
