[tool.poetry]
name = "aps-gui"
version = "1.5.1"
description = ""
authors = [
    "Oddvar Lia <olia@equinor.com>",
    "Sindre Nistad <snis@equinor.com>",
    "Sebastian Vittersø <svit@equinor.com>",
]

[tool.poetry.dependencies]
python = "^3.9"
matplotlib = "^3.6.0"
numpy = "^1.19.5"
Pillow = "^10.3.0"
scipy = "^1.10.0"
xtgeo = "^4.3.3"
PyYAML = "^6.0"
gaussianfft = "^1.1.2"
fmu-tools = "^1.21.0"

[tool.poetry.dev-dependencies]
pytest = "^6.2.5"
graphviz = "^0.19.1"
piprot = "^0.9.11"
mypy = "^0.931"
Flask = "^3.1.1"
Flask-Cors = "^3.0.10"
gunicorn = "^22.0.0"
python-dotenv = "^0.19.2"
safety = "^1.10.3"
typing-extensions = "^4.12.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["I"]
ignore = [
    "F403",
    "F821",
    "E731",
    "E722",
    "E721",
    "F841",
]
