version: 2
updates:
  - package-ecosystem: uv
    directory: '/'
    schedule:
      interval: monthly
    groups:
      python:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: '/gui/'
    schedule:
      interval: monthly
    groups:
      npm:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: monthly

  - package-ecosystem: devcontainers
    directory: '/.devcontainer/'
    schedule:
      interval: monthly
