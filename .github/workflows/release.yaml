name: 'Create a new release'

on:
  push:
    tags:
      - v*
    branches:
      - main

permissions:
  contents: read

jobs:
  build-gui:
    uses: ./.github/workflows/build-plugin.yaml
    with:
      stable: ${{ startsWith(github.ref, 'refs/tags/v') && true || false }}

  publish:
    runs-on: ubuntu-latest
    needs: build-gui
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-artifacts-*
          merge-multiple: true

      - name: Publish the APS-Facies plugin to GitHub
        run: |
          mise tasks run publish ${{ startsWith(github.ref, 'refs/tags/v') && '--stable' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
