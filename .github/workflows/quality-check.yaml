name: 'Build and test the GUI'
# This workflow should only test that the pushed code works well.
# Consider it a quality check workflow.

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  pre-commit-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml', 'mise.toml') }}
      - name: Cache Node.js dependencies
        # Used by some of the pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gui/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('gui/yarn.lock', 'gui/package.json') }}
      - run: pre-commit run --all-files --show-diff-on-failure --color=always
        shell: bash

  unit-tests-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Cache Node.js dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gui/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('gui/yarn.lock', 'gui/package.json') }}

      - name: Install Node.js dependencies
        working-directory: gui
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        working-directory: gui
        run: yarn test:unit

  build-gui:
    uses: ./.github/workflows/build-plugin.yaml
