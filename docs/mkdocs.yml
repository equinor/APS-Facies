      - Probability logs:
          - prepare-facies-probabilities/probability-logs/README.md
          - Facies log:
              - prepare-facies-probabilities/probability-logs/facies-log/README.md
          - prepare-facies-probabilities/probability-logs/conditional-probabilities-given-facies/README.md
      - Probability trends:
