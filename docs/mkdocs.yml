          - prepare-facies-probabilities/probability-trends/trends-from-geological-interpretations/README.md
      - Conditioned probability cubes:
          - prepare-facies-probabilities/conditioned-probability-cubes/README.md
          - prepare-facies-probabilities/conditioned-probability-cubes/rms-petrosim-to-condition-3d-probability-parameters/README.md
      - prepare-facies-probabilities/normalisation/README.md
  - APS toolbox:
      - aps-toolbox/README.md
      - aps-toolbox/probability-logs/README.md
      - aps-toolbox/probability-trends/README.md
      - aps-toolbox/redefine-or-merge-blocked-well-facies-logs/README.md
      - aps-toolbox/convert-bitmap-to-rms-surface-format/README.md
      - aps-toolbox/check-normalisation-of-facies-probabilities/README.md
      - aps-toolbox/copy-3d-parameters-to-or-from-ertbox/README.md
  - APS model file format:
      - aps-model-file-format/README.md
  - Mind Manager map: mind-manager/index.html

markdown_extensions:
  - smarty
  - toc:
      permalink: true
  - sane_lists

  # For MathJax
  - pymdownx.arithmatex:
      generic: true

  # Abbreviation
  - abbr
  - attr_list
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md

  # Icons and emojis
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - admonition
  - pymdownx.details
  - pymdownx.superfences

  # Definitions
  - def_list

# MathJax
extra_javascript:
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - 'assets/stylesheets/mkdocs-eq.css'
  - 'https://cdn.eds.equinor.com/font/equinor-font.css'

theme:
  name: material
  icon:
    repo: fontawesome/brands/github

  palette:
    # Palette toggle for automatic mode
    - media: '(prefers-color-scheme)'
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true

watch:
  - includes
